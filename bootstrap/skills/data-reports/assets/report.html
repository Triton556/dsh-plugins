<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{--bg:#0e1114;--panel:#161b21;--line:#2a323b;--ink:#e8edf3;--dim:#98a5b4;--faint:#6c7a89;
        --hot:#ff6b57;--warm:#f0a445;--good:#43c08a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",system-ui,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:36px 22px 90px}
  h1{font-size:25px;margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:18px;margin:40px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
  p{margin:10px 0}
  .sub{color:var(--dim);margin:0 0 24px}
  figure{margin:16px 0}
  figcaption{color:var(--faint);font-size:13px;margin-top:8px}
  code{font:13px "Cascadia Mono",Consolas,monospace;background:#0b0e12;border:1px solid var(--line);
       border-radius:4px;padding:1px 5px;color:#c9d6e4}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .lead{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--good);
        border-radius:8px;padding:16px 18px;margin:0 0 6px}
  .note{color:var(--faint);font-size:13px;border-left:2px solid var(--line);padding-left:12px;margin:14px 0}
  .stage{background:#0b0e12;border:1px solid var(--line);border-radius:10px;padding:10px}
  .stage svg,.stage canvas{display:block;width:100%;height:auto}
  .ctrls{display:flex;align-items:center;gap:14px;margin:10px 4px 2px;font-size:13px;color:var(--dim);flex-wrap:wrap}
  .ctrls input[type=range]{flex:1;min-width:140px;accent-color:var(--hot)}
  .ctrls label{display:flex;align-items:center;gap:6px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>__TITLE__</h1>
<p class="sub">__SUBTITLE__</p>

<div class="lead">
<p style="margin:0"><b>__CLAIM__</b> Одна фраза, которую доказывают фигуры ниже. Если её нельзя написать, фигур быть не должно.</p>
</div>

<h2>1 · __SECTION__</h2>
<figure>
  <div class="stage"><!-- inline SVG from assets/svg_chart.py goes here --></div>
  <figcaption>__CAPTION__ — повторяет утверждение с числами и говорит, что здесь нельзя проверить.</figcaption>
</figure>

<h2>2 · __SECTION__</h2>
<div class="stage"><canvas id="model" style="display:block;width:100%;height:560px;touch-action:none;cursor:grab"></canvas></div>
<div class="ctrls">
  <span>поворот</span><input type="range" id="yaw" min="0" max="90" value="38">
  <label><input type="checkbox" id="showB" checked> слой</label>
  <label><input type="checkbox" id="showM" checked> метки</label>
  <span id="stat" style="margin-left:auto;color:#6c7a89"></span>
</div>
<p class="note">__MODEL_NOTE__</p>

<script id="payload" type="application/json">{"bricks":[],"markers":[]}</script>
<script>
/* Canvas block: keep the self-check line and the try/catch — a silent throw leaves a
   blank box. Replace the body with the ported geometry from assets/spatial.py. */
try {
  const D = JSON.parse(document.getElementById('payload').textContent);
  const cv = document.getElementById('model'), g = cv.getContext('2d');
  const stat = document.getElementById('stat');
  function render() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, r.width, r.height);
    g.fillStyle = '#98a5b4';
    g.fillText('модель не подключена', 16, 28);
  }
  document.getElementById('yaw').addEventListener('input', render);
  window.addEventListener('resize', render);
  render();
  stat.textContent = (D.bricks.length) + ' элементов, поворот 38°';
} catch (e) {
  document.getElementById('stat').textContent = 'ОШИБКА: ' + (e && e.message ? e.message : e);
}
</script>
</main>
</body>
</html>
